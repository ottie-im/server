[global]
# TODO: 临时域名，最终改为 ottie 正式域名（如 ottie.app）
# ⚠️ server_name 一旦设定不可更改，迁移 = 重建数据库 + 所有用户重新注册
server_name = "ottie.claws.company"
database_path = "/var/lib/tuwunel"
port = [8008]
address = "0.0.0.0"
allow_registration = true
registration_token = "ottie-dev-token"
allow_federation = true
trusted_servers = ["matrix.org"]
log = "info"

# Well-known for Element and other clients to auto-discover
[global.well_known]
client = "https://ottie.claws.company"
server = "ottie.claws.company:443"

# Google OIDC 登录配置
# TODO: 需要在 Google Cloud Console 创建 OAuth 2.0 凭证
# 1. 访问 https://console.cloud.google.com/apis/credentials
# 2. 创建 OAuth 2.0 Client ID（Web application）
# 3. Authorized redirect URI 填：
#    https://ottie.claws.company/_matrix/client/unstable/login/sso/callback/<client_id>
# 4. 把 client_id 和 client_secret 填到下面
#
# 取消注释以下配置即可启用：
#
# [[global.identity_provider]]
# brand = "Google"
# client_id = "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
# client_secret = "YOUR_GOOGLE_CLIENT_SECRET"
# issuer_url = "https://accounts.google.com"
# callback_url = "https://ottie.claws.company/_matrix/client/unstable/login/sso/callback/YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
# default = true
